# ============================================================
# KA Music (kgka_Music_hl) — Windows x64 Release 构建
# 说明：Flutter 3.47+ 在 Windows 上仅支持 x64 与 arm64，
#       已不再提供 32 位 x86 (win32) 目标。
# ============================================================

name: Windows x64 Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (非阻断)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # 新 MSVC (14.51+) 把 <experimental/coroutine> 从警告升级为 STL1011 硬错误，
      # just_audio_windows / permission_handler_windows 仍在用。
      # CL 环境变量会被 cl.exe 自动追加为编译选项，定义该宏即可压制。
      - name: Set MSVC compat env
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS'

      - name: Build Windows x64 release
        run: flutter build windows --release

      - name: 列产物
        shell: pwsh
        run: |
          Write-Host "=== Release 目录内容 ==="
          Get-ChildItem -Path "build/windows/x64/runner/Release" -Recurse |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: 打包 zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "kgka-music-windows-x64.zip" -Force
          Get-Item "kgka-music-windows-x64.zip" | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kgka-music-windows-x64
          path: kgka-music-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
